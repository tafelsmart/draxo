<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draxo Client — License Key</title>
<style>
    :root{--bg:#0a0a0f;--card:#141418;--border:#252530;--accent:#8b6cff;--glow:rgba(139,108,255,.15);--text:#e0e0e0;--muted:#888;--success:#2ed573;--warn:#ffa502;--danger:#ff4757;--radius:12px}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;background-image:radial-gradient(ellipse at 50% 0%,var(--glow) 0%,transparent 60%)}
    .container{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:40px;max-width:540px;width:92%;box-shadow:0 0 80px var(--glow)}
    .logo{text-align:center;margin-bottom:24px}
    .logo h1{font-size:28px;font-weight:800;letter-spacing:2px;background:linear-gradient(135deg,#8b6cff,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .logo p{color:var(--muted);font-size:14px;margin-top:4px}
    label{display:block;color:#aaa;font-size:13px;font-weight:600;margin-bottom:8px}
    input[type=text],button{width:100%;padding:14px 18px;border-radius:10px;font-size:15px;font-family:inherit;outline:none;transition:all .2s}
    input[type=text]{background:#1a1a22;border:1px solid #333;color:#fff;font-family:'SF Mono','Fira Code',monospace}
    input[type=text]:focus{border-color:var(--accent)}
    button{background:var(--accent);border:none;color:#fff;font-weight:700;cursor:pointer;margin-top:12px;letter-spacing:.5px}
    button:hover{filter:brightness(1.15);transform:translateY(-1px)}
    button:active{transform:translateY(0)}
    button:disabled{opacity:.4;cursor:not-allowed}
    .section{margin:24px 0}
    .section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:14px}
    .step{background:#1a1a22;border:1px solid #2a2a35;border-radius:10px;padding:14px 18px;margin-bottom:10px;display:flex;align-items:center;gap:14px;transition:border .2s}
    .step:hover{border-color:var(--accent);background:#1e1e28}
    .step-num{background:var(--accent);color:#fff;border-radius:50%;width:30px;height:30px;min-width:30px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
    .step-info{font-size:13px;color:#aaa}
    .step-info strong{color:#fff}
    .step-link{color:var(--accent);text-decoration:none;font-weight:600}
    .step-link:hover{text-decoration:underline}
    .step-badge{background:#2a2040;color:#b090d0;border-radius:6px;padding:2px 8px;font-size:11px;margin-left:6px;font-weight:600}
    .alert{border-radius:10px;padding:16px 20px;margin:20px 0;font-size:13px;line-height:1.5}
    .alert-warn{background:#1a1008;border:1px solid #402800;color:#ffb347}
    .alert-success{background:#081a10;border:1px solid #004020;color:#7bed9f}
    .alert-error{background:#1a0808;border:1px solid #400000;color:#ff6b6b}
    .key-result{background:#0f0f14;border:1px solid var(--accent);border-radius:12px;padding:24px;margin:24px 0;text-align:center;box-shadow:0 0 40px var(--glow)}
    .key-value{font-family:'SF Mono','Fira Code',monospace;font-size:17px;color:var(--accent);word-break:break-all;letter-spacing:1px;font-weight:700}
    .key-label{font-size:12px;color:var(--muted);margin-top:8px}
    .key-expire{color:var(--warn);font-size:13px;margin-top:12px;font-weight:600}
    .key-hint{background:#1a1a22;border:1px solid #2a2a35;border-radius:8px;padding:12px 16px;margin-top:16px;font-size:12px;color:var(--muted);line-height:1.5}
    .key-hint code{background:#0a0a0f;padding:2px 6px;border-radius:4px;font-family:monospace;color:#ddd}
    .footer{text-align:center;margin-top:28px;font-size:11px;color:#444}
    .footer a{color:#555;text-decoration:none}.footer a:hover{color:var(--accent)}
    .hidden{display:none!important}
</style>
</head>
<body>
<div class="container">
    <div class="logo"><h1>DRAXO CLIENT</h1><p>License Key Generator</p></div>
    <div id="check-banner"></div>

    <div id="step-hwid">
        <label for="hwid">Your HWID</label>
        <input type="text" id="hwid" placeholder="Paste your 32-character HWID..." maxlength="32" oninput="onHwidInput()">
        <div id="hwid-hint" style="margin-top:8px;font-size:12px;color:var(--muted);min-height:18px"></div>
    </div>

    <div id="step-ads" class="hidden">
        <div class="section">
            <div class="section-title">Complete ALL 3 Ads to Get Your Key</div>
            <div id="ad-steps"></div>
        </div>
        <div class="alert alert-warn">Complete all 3 ads in order. After the 3rd ad, return here and generate your key.</div>
        <button id="btn-generate" onclick="generate()">Generate Key</button>
        <div id="rate-limit-msg" class="alert alert-error hidden"></div>
    </div>

    <div id="step-result" class="hidden"></div>
    <div class="footer">Draxo Client &copy; 2026 | <a href="?check">Self-Check</a></div>
</div>

<script>
// Edit these with YOUR Linkvertise links:
const LINKVERTISE_LINKS=[
    'https://linkvertise.com/6255141/BaT3NYhzY2vK?hwid={HWID}',
    'https://linkvertise.com/6255141/BaT3NYhzY2vK?hwid={HWID}',
    'https://linkvertise.com/6255141/BaT3NYhzY2vK?hwid={HWID}',
];
const KEY_HOURS=24;
const B32='0123456789ABCDEFGHJKMNPQRSTVWXYZ';
const SA=[0xD4,0x7B,0x0E,0x28,0x13,0x9C,0xDF,0x69],SB=[0x1A,0xE2,0x6D,0x47,0x86,0x71,0x36,0xF5],SC=[0x8F,0x55,0xA3,0xC9,0x2D,0xB0,0xE8,0xAB],SD=[0x3C,0x91,0xBF,0xFA,0x5E,0x44,0x0A,0x12],SX=[0xA3,0x5C,0xF1,0x7E];

function recon(){let o=new Uint8Array(32);for(let i=0;i<8;i++){o[i*4]=SA[i]^((SX[0]+i)&0xFF);o[i*4+1]=SB[i]^((SX[1]+i)&0xFF);o[i*4+2]=SC[i]^((SX[2]+i)&0xFF);o[i*4+3]=SD[i]^((SX[3]+i)&0xFF)}return o}
function fwd(d,k){let o=new Uint8Array(d.length),p=0x7B;for(let i=0;i<d.length;i++){let kk=k[i%k.length];o[i]=(d[i]^kk^p^k[(i+7)%k.length]^(i&0xFF))&0xFF;p=o[i]}return o}
function b32e(d){let b=0,c=0,o='';for(let i=0;i<d.length;i++){b=(b<<8)|d[i];c+=8;while(c>=5){c-=5;o+=B32[(b>>c)&0x1F]}}if(c>0)o+=B32[(b<<(5-c))&0x1F];return o}
async function sha(v){return new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)))}
async function gen(hwid,h){let hs=await sha(hwid),now=Math.floor(Date.now()/1000),exp=h>0?(now+h*3600):0,p=new Uint8Array(16);for(let i=0;i<12;i++)p[i]=hs[i];p[12]=(exp>>>24)&0xFF;p[13]=(exp>>>16)&0xFF;p[14]=(exp>>>8)&0xFF;p[15]=exp&0xFF;let x=b32e(fwd(p,recon()));while(x.length<26)x+='0';x=x.substring(0,26);return'DRAXO-'+x.substring(0,5)+'-'+x.substring(5,10)+'-'+x.substring(10,15)+'-'+x.substring(15,20)+'-'+x.substring(20,25)+'-'+x.substring(25,26)}
async function sc(){let e='DRAXO-5YQZZ-4VAK1-8FJGN-XTDDG-A9076-M';let g=await gen('0123456789ABCDEF0123456789ABCDEF',0);return[g===e,g]}
function rl(h){try{let d=JSON.parse(localStorage.getItem('dkr')||'{}');if(d[h]&&Date.now()-d[h]<864e5)return!1;return!0}catch(e){return!0}}
function rr(h){try{let d=JSON.parse(localStorage.getItem('dkr')||'{}');d[h]=Date.now();localStorage.setItem('dkr',JSON.stringify(d))}catch(e){}}
let chw='';
function onHwidInput(){let v=document.getElementById('hwid').value.replace(/[^0-9A-Fa-f]/g,'').toUpperCase();document.getElementById('hwid').value=v;let h=document.getElementById('hwid-hint');if(v.length===32){h.innerHTML='Valid HWID';h.style.color='#2ed573';showAds(v)}else if(v.length>0){h.innerHTML='Need 32 chars (currently '+v.length+')';h.style.color='#ffa502';document.getElementById('step-ads').classList.add('hidden');document.getElementById('step-result').classList.add('hidden')}else{h.innerHTML='';document.getElementById('step-ads').classList.add('hidden');document.getElementById('step-result').classList.add('hidden')}}
function showAds(h){chw=h;let s='';for(let i=0;i<LINKVERTISE_LINKS.length;i++)s+='<div class="step"><div class="step-num">'+(i+1)+'</div><div class="step-info"><strong>Ad '+(i+1)+'</strong><span class="step-badge">Linkvertise</span><br><a class="step-link" href="'+LINKVERTISE_LINKS[i].replace('{HWID}',h)+'" target="_blank" rel="noopener">Open Ad '+(i+1)+'</a></div></div>';document.getElementById('ad-steps').innerHTML=s||'<div class="alert alert-warn">No Linkvertise links configured. Edit LINKVERTISE_LINKS in page source.</div>';document.getElementById('step-ads').classList.remove('hidden');document.getElementById('step-result').classList.add('hidden')}
async function generate(){if(!chw||chw.length!==32)return;if(!rl(chw)){document.getElementById('rate-limit-msg').innerHTML='Rate limit: 1 key per HWID per 24h';document.getElementById('rate-limit-msg').classList.remove('hidden');return}document.getElementById('rate-limit-msg').classList.add('hidden');let b=document.getElementById('btn-generate');b.disabled=!0;b.textContent='Generating...';try{let k=await gen(chw,KEY_HOURS);rr(chw);let es=new Date(Date.now()+KEY_HOURS*36e5).toISOString().replace('T',' ').substring(0,16);document.getElementById('step-result').innerHTML='<div class="key-result"><div style="color:var(--success);font-size:13px;font-weight:600;margin-bottom:12px">Your 24-Hour License Key</div><div class="key-value">'+k+'</div><div class="key-label">HWID-bound - only works on YOUR machine</div><div class="key-expire">Expires: '+es+' UTC</div></div><div class="key-hint"><strong>How to activate:</strong><br>1. Open Draxo or inject DLL<br>2. Open menu (RSHIFT or INSERT)<br>3. CONFIG tab - LICENSE section<br>4. Paste key and click Activate</div>';document.getElementById('step-result').classList.remove('hidden')}catch(e){document.getElementById('step-result').innerHTML='<div class="alert alert-error">Error: '+(e.message||'Failed')+'</div>';document.getElementById('step-result').classList.remove('hidden')}finally{b.disabled=!1;b.textContent='Generate Key'}}
// Self-check on load
if(location.search.includes('check')||location.hash.includes('check')){sc().then(function(r){let ok=r[0],got=r[1];document.getElementById('check-banner').innerHTML=ok?'<div class="alert alert-success">Self-check PASSED - keygen matches DLL</div>':'<div class="alert alert-error">Self-check FAILED<br>Expected: DRAXO-5YQZZ-4VAK1-8FJGN-XTDDG-A9076-M<br>Got: '+got+'</div>'})}
</script>
</body>
</html>
