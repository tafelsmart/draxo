<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draxo Client — License Key</title>
<style>
    :root{--bg:#0a0a0f;--card:#141418;--border:#252530;--accent:#8b6cff;--glow:rgba(139,108,255,.15);--text:#e0e0e0;--muted:#888;--success:#2ed573;--warn:#ffa502;--danger:#ff4757;--radius:12px}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;background-image:radial-gradient(ellipse at 50% 0%,var(--glow) 0%,transparent 60%)}
    .container{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:40px;max-width:540px;width:92%;box-shadow:0 0 80px var(--glow)}
    .logo{text-align:center;margin-bottom:24px}
    .logo h1{font-size:28px;font-weight:800;letter-spacing:2px;background:linear-gradient(135deg,#8b6cff,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .logo p{color:var(--muted);font-size:14px;margin-top:4px}
    label{display:block;color:#aaa;font-size:13px;font-weight:600;margin-bottom:8px}
    input[type=text],button{width:100%;padding:14px 18px;border-radius:10px;font-size:15px;font-family:inherit;outline:none;transition:all .2s}
    input[type=text]{background:#1a1a22;border:1px solid #333;color:#fff;font-family:'SF Mono','Fira Code',monospace}
    input[type=text]:focus{border-color:var(--accent)}
    button{background:var(--accent);border:none;color:#fff;font-weight:700;cursor:pointer;margin-top:12px;letter-spacing:.5px}
    button:hover{filter:brightness(1.15);transform:translateY(-1px)}
    button:active{transform:translateY(0)}
    button:disabled{opacity:.4;cursor:not-allowed}
    .section{margin:24px 0}
    .section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:14px}
    .step{background:#1a1a22;border:1px solid #2a2a35;border-radius:10px;padding:14px 18px;margin-bottom:10px;display:flex;align-items:center;gap:14px;transition:border .2s}
    .step:hover{border-color:var(--accent);background:#1e1e28}
    .step-num{background:var(--accent);color:#fff;border-radius:50%;width:30px;height:30px;min-width:30px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
    .step-info{font-size:13px;color:#aaa}
    .step-info strong{color:#fff}
    .step-link{color:var(--accent);text-decoration:none;font-weight:600}
    .step-link:hover{text-decoration:underline}
    .step-badge{background:#2a2040;color:#b090d0;border-radius:6px;padding:2px 8px;font-size:11px;margin-left:6px;font-weight:600}
    .alert{border-radius:10px;padding:16px 20px;margin:20px 0;font-size:13px;line-height:1.5}
    .alert-warn{background:#1a1008;border:1px solid #402800;color:#ffb347}
    .alert-success{background:#081a10;border:1px solid #004020;color:#7bed9f}
    .alert-error{background:#1a0808;border:1px solid #400000;color:#ff6b6b}
    .key-result{background:#0f0f14;border:1px solid var(--accent);border-radius:12px;padding:24px;margin:24px 0;text-align:center;box-shadow:0 0 40px var(--glow)}
    .key-value{font-family:'SF Mono','Fira Code',monospace;font-size:17px;color:var(--accent);word-break:break-all;letter-spacing:1px;font-weight:700}
    .key-label{font-size:12px;color:var(--muted);margin-top:8px}
    .key-expire{color:var(--warn);font-size:13px;margin-top:12px;font-weight:600}
    .key-hint{background:#1a1a22;border:1px solid #2a2a35;border-radius:8px;padding:12px 16px;margin-top:16px;font-size:12px;color:var(--muted);line-height:1.5}
    .key-hint code{background:#0a0a0f;padding:2px 6px;border-radius:4px;font-family:monospace;color:#ddd}
    .footer{text-align:center;margin-top:28px;font-size:11px;color:#444}
    .footer a{color:#555;text-decoration:none}.footer a:hover{color:var(--accent)}
    .hidden{display:none!important}
</style>
</head>
<body>
<div class="container">
    <div class="logo"><h1>DRAXO CLIENT</h1><p>License Key Generator</p></div>
    <div id="check-banner"></div>

    <div id="step-hwid">
        <label for="hwid">Your HWID</label>
        <input type="text" id="hwid" placeholder="Paste your 32-character HWID..." maxlength="32" oninput="onHwidInput()">
        <div id="hwid-hint" style="margin-top:8px;font-size:12px;color:var(--muted);min-height:18px"></div>
    </div>

    <div id="step-ads" class="hidden">
        <div class="section">
            <div class="section-title">Complete ALL 3 Ads to Get Your Key</div>
            <div id="ad-steps"></div>
        </div>
        <div class="alert alert-warn">Complete all 3 ads in order. After the 3rd ad, return here and generate your key.</div>
        <button id="btn-generate" onclick="generate()">Generate Key</button>
        <div id="rate-limit-msg" class="alert alert-error hidden"></div>
    </div>

    <div id="step-result" class="hidden"></div>
    <div class="footer">Draxo Client &copy; 2026 | <a href="?check">Self-Check</a></div>
</div>

<script>
// Edit these with YOUR Linkvertise links:
const LINKVERTISE_LINKS=[
    'https://linkvertise.com/6255141/BaT3NYhzY2vK?hwid={HWID}',
    'https://linkvertise.com/6255141/BaT3NYhzY2vK?hwid={HWID}',
    'https://linkvertise.com/6255141/BaT3NYhzY2vK?hwid={HWID}',
];
const KEY_HOURS=24;
/* ══════════════════════════════════════════════════════════════════════
   BROWSER-KEYGEN ENTFERNT (v2)
   ──────────────────────────────────────────────────────────────────────
   Bis hier lief die komplette Schluessel-Erzeugung im Browser: ein
   32-Byte-Geheimnis wurde aus vier Byte-Tabellen rekonstruiert und
   damit offline beliebige Keys erzeugt. Wer den Quelltext las, hatte
   unbegrenzt gueltige Keys — ohne Anmeldung und ohne Werbung.

   Grants sind jetzt asymmetrisch (Ed25519). Signieren kann nur der
   Server, weil nur er den privaten Schluessel hat. Das ist im Browser
   grundsaetzlich nicht nachbaubar und auch nicht gewollt.

   Dein Grant kommt aus dem Discord-Bot: dort "/key" ausfuehren oder
   auf "Key holen" klicken. Er ist an dein Konto und (optional) an
   deinen Rechner gebunden.
   ══════════════════════════════════════════════════════════════════════ */
function keygenRetired(){
    var box = document.getElementById('step-result');
    if (box) {
        box.classList.remove('hidden');
        box.innerHTML =
            '<div class="guide-box"><div class="guide-summary" style="cursor:default">' +
            'Key gibt es jetzt nur noch vom Server</div>' +
            '<div class="guide-content">' +
            'Diese Seite erzeugt keine Keys mehr. Ein Key kann nur noch der Server ' +
            'signieren — deshalb bekommst du deinen direkt im Discord-Bot.<br><br>' +
            '<strong>So gehst du vor:</strong><br>' +
            '1. Starte den Draxo Launcher und melde dich mit Discord an.<br>' +
            '2. Kopiere deine HWID aus der Lizenz-Karte (<strong>📋 Copy</strong>).<br>' +
            '3. Im Discord-Server: <code>/key hwid:DEINE_HWID</code> oder den ' +
            'Knopf <strong>🔑 Key holen</strong>.<br><br>' +
            '<a href="https://discord.gg/5gXXHcv6nj" style="color:#8B5CF6;font-weight:700">' +
            '💬 Zum Discord-Server</a>' +
            '</div></div>';
    }
}
document.addEventListener('DOMContentLoaded', keygenRetired);
</script>
</body>
</html>
