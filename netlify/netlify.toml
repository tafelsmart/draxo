# Draxo Client — Netlify Configuration
# Deploy this folder via Netlify Drag & Drop or Git.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/keygen.html"
  [headers.values]
    Cache-Control = "no-store"
